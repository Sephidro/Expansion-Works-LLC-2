name: Build managed content

on:
  push:
    branches-ignore:
      - main
    paths:
      - "content/articles/*.json"

permissions:
  contents: write

concurrency:
  group: content-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install --ignore-scripts

      - name: Generate managed content
        run: npm run build:content

      - name: Validate generated result
        run: npm test

      - name: Commit generated files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides sitemap.xml feed.xml llms.txt
          git commit -m "Build managed StackBrief content"
          git push
